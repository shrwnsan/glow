version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: glow
    env:
      - CGO_ENABLED=0
    ldflags: -s -w -X main.Version={{.Version}} -X main.CommitSHA={{.Commit}} -X main.CommitDate={{.CommitDate}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - completions/*
      - manpages/*

brews:
  - name: glow
    repository:
      owner: shrwnsan
      name: homebrew-tap
    folder: Formula
    homepage: https://github.com/shrwnsan/glow
    description: Render markdown on the CLI, with pizzazz!
    license: MIT
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
